<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="siri-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ai-bg)"/>
  <!-- Ambient glow orb -->
  <circle cx="50" cy="50" r="26" fill="url(#siri-glow)" filter="url(#glow-blur)" opacity="0.8"/>
  <!-- Siri swirls -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="url(#siri-glow)" stroke-width="4.5"/>
  <ellipse cx="50" cy="50" rx="22" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(35 50 50)"/>
  <ellipse cx="50" cy="50" rx="22" ry="12" fill="none" stroke="#f43f5e" stroke-width="2.5" transform="rotate(-35 50 50)"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
