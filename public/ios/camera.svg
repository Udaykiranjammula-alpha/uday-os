<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cam-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#434343"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <radialGradient id="lens-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#cam-bg)"/>
  <!-- Camera body -->
  <rect x="18" y="28" width="64" height="48" rx="10" fill="#e2e8f0"/>
  <!-- Top notch -->
  <rect x="36" y="22" width="28" height="10" rx="4" fill="#cbd5e1"/>
  <!-- Flash dot -->
  <circle cx="70" cy="38" r="4" fill="#fbbf24"/>
  <!-- Main lens circle -->
  <circle cx="50" cy="52" r="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="50" cy="52" r="13" fill="url(#lens-grad)"/>
  <circle cx="46" cy="48" r="4" fill="#ffffff" opacity="0.6"/>
</svg>
