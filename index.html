    <style>
      /* Instant Apple Boot Splash Screen (rendered before any JS bundle parses) */
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .apple-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        z-index: 99999;
        user-select: none;
      }
      .apple-boot-logo {
        width: 64px;
        height: 64px;
        fill: #f5f5f7;
        margin-bottom: 36px;
        animation: appleLogoPulse 2s ease-in-out infinite;
      }
      .apple-boot-bar-track {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .apple-boot-bar-progress {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: #f5f5f7;
        border-radius: 9999px;
        width: 0%;
        animation: appleProgressFill 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      .apple-boot-text {
        margin-top: 18px;
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.5px;
      }
      @keyframes appleLogoPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes appleProgressFill {
        0% { width: 4%; }
        45% { width: 55%; }
        85% { width: 88%; }
        100% { width: 100%; }
      }
    </style>
  </head>
